{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html>
<html><head><meta charset="utf-8"><style>
* {font-synthesis:none;font-weight:400;letter-spacing:0;font-variant-ligatures:none}
body {width:250px; height:122px; background:{{ ink.white }}; color:{{ ink.black }}; font-family:"Fusion Pixel 12"; display:flex; align-items:center; font-size:12px; line-height:1.2;}
.day {width:104px; text-align:center; font-size:80px; font-weight:400; line-height:1; color:{{ accent if data.weekday >= 5 else ink.black }}; font-family:"Unifont";}
.info {flex:1; padding-left:8px; border-left:2px solid {{ ink.black }};}
.l1 {font:12px/16px "Fusion Pixel 12";}
.l2 {margin-top:4px; font:16px/20px "Unifont";}
.l3 {margin-top:4px; color:{{ accent }}; font:12px/16px "Fusion Pixel 12";}
</style></head><body>
  <div class="day">{{ data.day }}</div>
  <div class="info">
    <div class="l1">{{ data.month }}月 星期{{ data.weekday_zh }}</div>
    <div class="l2">{{ data.lunar_month }}{{ data.lunar_day }}</div>
    <div class="l3">{{ data.solar_term or (data.festivals[0] if data.festivals else data.year_ganzhi ~ data.zodiac ~ "年") }}</div>
  </div>
</body></html>
