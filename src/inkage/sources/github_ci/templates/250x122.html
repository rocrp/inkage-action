{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html><html><head><meta charset="utf-8"><style>
  * {
    font-weight: 400;
    font-synthesis: none;
    letter-spacing: 0;
    font-variant-ligatures: none;
  }
  body {
    font-size: 12px;
    line-height: 1.2;
    width: 250px;
    height: 122px;
    box-sizing: border-box;
    padding: 5px 8px;
    margin: 0;
    background: {{ink.white}};
    color: {{ink.black}};
    font-family: "Fusion Pixel 12";
  }
  .one {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .repo {
    font: 12px/16px "Fusion Pixel 12";
    border-bottom: 2px solid {{ink.black}};
  }
  .state {
    font: 24px/30px "Fusion Pixel 12";
  }
  .failed {
    color: {{accent}};
  }
  .name {
    font: 12px/16px "Fusion Pixel 12";
  }
  .meta,.foot {
    font: 10px/14px "Fusion Pixel 10";
    margin-top: 2px;
  }
</style></head><body><div class="repo one">{{data.repo}}</div>{% if data.runs %}{% set run=data.runs[0] %}<div class="state one {% if run.failed %}failed{% endif %}">{{run.state}}</div><div class="name one">{{run.name}}</div><div class="meta one">{{run.branch}} · {{run.sha}} · {{run.updated}}</div>{% else %}<div class="state">No runs</div>{% endif %}<div class="foot">Checked {{data.checked}} · latest run</div></body></html>
