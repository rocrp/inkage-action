{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html><html><head><meta charset="utf-8"><style>
body{width:250px;height:122px;box-sizing:border-box;padding:5px 8px;margin:0;background:{{ink.white}};color:{{ink.black}};font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.repo{font-size:14px;font-weight:900;border-bottom:2px solid {{ink.black}}}.state{font-size:24px;font-weight:900;line-height:1.3}.failed{color:{{accent}}}.name{font-size:13px;font-weight:700}.meta,.foot{font-size:10px;margin-top:2px}
</style></head><body><div class="repo one">{{data.repo}}</div>{% if data.runs %}{% set run=data.runs[0] %}<div class="state one {% if run.failed %}failed{% endif %}">{{run.state}}</div><div class="name one">{{run.name}}</div><div class="meta one">{{run.branch}} · {{run.sha}} · {{run.updated}}</div>{% else %}<div class="state">No runs</div>{% endif %}<div class="foot">Checked {{data.checked}} · latest run</div></body></html>
