{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html>
<html><head><meta charset="utf-8"><style>
  * {
    font-weight: 400;
    font-synthesis: none;
    letter-spacing: 0;
    font-variant-ligatures: none;
  }
  body {
    font-size: 12px;
    line-height: 1.2;
    margin: 0;
    width: 250px;
    height: 122px;
    background: {{ ink.white }};
    color: {{ ink.black }};
    font-family: "Fusion Pixel 12";
    box-sizing: border-box;
    padding: 3px 8px;
  }
  .head {
    font: 12px/16px "Fusion Pixel 12";
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid {{ ink.black }};
  }
  .head span {
    font: 10px/14px "Fusion Pixel 10";
  }
  .row {
    display: flex;
    align-items: baseline;
    height: 30px;
  }
  .sym {
    font: 12px/16px "Fusion Pixel 12";
    width: 48px;
  }
  .rate {
    font: 22px/28px "Departure Mono";
    flex: 1;
  }
  .chg {
    font: 12px/16px "Fusion Pixel 12";
  }
  .chg.down {
    color: {{ accent }};
  }
</style></head><body>
  <div class="head">1 {{ data.base }} =<span>ECB {{ data.date }}</span></div>
  {%- for r in data.rates[:3] %}
  <div class="row">
    <div class="sym">{{ r.symbol }}</div>
    <div class="rate">{{ r.rate }}</div>
    <div class="chg {{ r.direction }}">{{ "▲" if r.direction == "up" else ("▼" if r.direction == "down" else "■") }}{{ r.change_pct }}</div>
  </div>
  {%- endfor %}
</body></html>
