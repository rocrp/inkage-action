{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; width: 250px; height: 122px; background: {{ ink.white }}; color: {{ ink.black }};
         font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif; box-sizing: border-box; padding: 3px 8px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 900;
          border-bottom: 2px solid {{ ink.black }}; }
  .head span { font-size: 12px; font-weight: 700; }
  .row { display: flex; align-items: baseline; height: 30px; }
  .sym { width: 48px; font-size: 17px; font-weight: 900; }
  .rate { flex: 1; font-size: 24px; font-weight: 900; }
  .chg { font-size: 14px; font-weight: 900; }
  .chg.down { color: {{ accent }}; }
</style></head><body>
  <div class="head">1 {{ data.base }} =<span>ECB {{ data.date }}</span></div>
  {%- for r in data.rates[:3] %}
  <div class="row">
    <div class="sym">{{ r.symbol }}</div>
    <div class="rate">{{ r.rate }}</div>
    <div class="chg {{ r.direction }}">{{ "▲" if r.direction == "up" else ("▼" if r.direction == "down" else "■") }}{{ r.change_pct }}</div>
  </div>
  {%- endfor %}
</body></html>
