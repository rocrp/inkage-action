<!doctype html>
<html lang="{{ data.language }}"><head><meta charset="utf-8"><style>
* {font-synthesis:none;font-weight:400;letter-spacing:0;font-variant-ligatures:none}
body {width:250px; height:122px; box-sizing:border-box; padding:4px 9px; color:{{ ink.black }}; background:{{ ink.white }}; display:flex; flex-direction:column; font-family:"Fusion Pixel 12"; font-size:12px; line-height:1.2;}
header {display:flex; justify-content:space-between; border-bottom:1px solid {{ ink.black }}; padding-bottom:2px; letter-spacing:0; font:10px/11px "Fusion Pixel 10";}
main {flex:1; display:flex; flex-direction:column; justify-content:center;}
h1 {margin:0 0 1px; font:12px/13px "Fusion Pixel 12";}
.line {white-space:normal; font:16px/17px "Unifont";}
footer {display:flex; justify-content:space-between; gap:4px; border-top:1px solid {{ ink.black }}; padding-top:2px; font:10px/11px "Fusion Pixel 10";}
html[lang="en"] .line {font:11px/14px "Departure Mono";}
html[lang="en"] h1 {font:12px/14px "Fusion Pixel 12"; margin-bottom:2px;}
</style></head><body>
<header><span>DAILY POETRY</span><span>{{ '中文' if data.language == 'zh' else 'ENGLISH' }}</span></header>
<main><h1>{{ data.title }}</h1>{% for line in data.lines %}<div class="line">{{ line }}</div>{% endfor %}</main>
<footer><span>{{ data.author }}</span><span>{{ data.source_label }}</span></footer>
</body></html>
