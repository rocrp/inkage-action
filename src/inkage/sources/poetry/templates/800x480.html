{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html>
<html lang="{{ data.language }}"><head><meta charset="utf-8"><style>
* {font-synthesis:none;font-weight:400;letter-spacing:0;font-variant-ligatures:none}
body {width:800px; height:480px; box-sizing:border-box; padding:28px 42px; color:{{ ink.black }}; background:{{ ink.white }}; display:flex; flex-direction:column; font-family:"Fusion Pixel 12"; font-size:12px; line-height:1.2;}
header {display:flex; justify-content:space-between; border-bottom:2px solid {{ ink.black }}; padding-bottom:10px; letter-spacing:0; font:20px/24px "Fusion Pixel 10";}
main {flex:1; display:flex; flex-direction:column; justify-content:center;}
h1 {margin:0 0 18px; color:{{ accent }}; font:32px/36px "Unifont";}
.line {white-space:normal; font:32px/48px "Unifont";}
footer {border-top:1px solid {{ ink.black }}; padding-top:10px; display:flex; justify-content:space-between; align-items:baseline;}
.author {font:20px/28px "Fusion Pixel 10";}
.source {font:20px/28px "Fusion Pixel 10";}
html[lang="en"] .line {font:22px/36px "Departure Mono";}

{% if panel.size == (528, 792) %}
body {width:528px; height:792px; margin:0; padding:24px; box-sizing:border-box}
body {padding:28px 24px}
header,footer {display:block; font-size:10px; line-height:16px}
header span,footer span {display:block}
h1 {font-size:32px; line-height:40px}
.line {font-size:32px; line-height:48px}
html[lang="en"] .line {font-size:22px; line-height:36px; overflow-wrap:anywhere}
.author,.source {font-size:10px; line-height:16px}
{% endif %}
</style></head><body>
<header><span>DAILY POETRY</span><span>{{ now.strftime('%d %b %Y') }}</span></header>
<main><h1>{{ data.title }}</h1>{% for line in data.lines %}<div class="line">{{ line }}</div>{% endfor %}</main>
<footer><span class="author">{{ data.author }}</span><span class="source">{{ data.source_label }} · Public domain</span></footer>
</body></html>
