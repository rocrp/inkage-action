<!doctype html><html><head><meta charset="utf-8"><style>
  * {
    font-weight: 400;
    font-synthesis: none;
    letter-spacing: 0;
    font-variant-ligatures: none;
  }
  body {
    font-size: 12px;
    line-height: 1.2;
    width: 250px;
    height: 122px;
    box-sizing: border-box;
    padding: 7px 9px;
    background: white;
    color: black;
    font-family: "Fusion Pixel 12";
  }
  .head {
    display: flex;
    gap: 6px;
    align-items: center;
    height: 28px;
    border-bottom: 2px solid black;
    padding-bottom: 4px;
  }
  img {
    width: 26px;
    height: 26px;
    border: 1px solid black;
  }
  .name {
    font: 12px/16px "Fusion Pixel 12";
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .body {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
  }
  .number {
    font: 22px/28px "Departure Mono";
    color: {{ ink.red if 'red' in panel.inks else ink.black }};
  }
  .label {
    font: 10px/14px "Fusion Pixel 10";
  }
  .annual {
    font: 10px/14px "Fusion Pixel 10";
  }
  .foot {
    font: 10px/14px "Fusion Pixel 10";
    margin-top: 4px;
    white-space: nowrap;
  }
</style></head><body>
<div class="head"><img src="{{ data.avatar }}" alt=""><span class="name">@{{ data.username }}</span></div>
<div class="body"><div><div class="number">{{ '{:,}'.format(data.recent_total) }}</div><div class="label">RECENT TOTAL</div><div class="annual">{{ '{:,}'.format(data.summary_total) }} annual</div></div>{% include 'wall.html' %}</div>
<div class="foot">{{ data.recent_start }} → {{ data.end }} · GitHub UTC</div>
</body></html>
