<!doctype html>
<html><head><meta charset="utf-8"><style>
  * {
    font-weight: 400;
    font-synthesis: none;
    letter-spacing: 0;
    font-variant-ligatures: none;
  }
  body {
    font-size: 12px;
    line-height: 1.2;
    width: 800px;
    height: 480px;
    box-sizing: border-box;
    padding: 20px 28px 14px;
    color: {{ ink.black }};
    background: {{ ink.white }};
    font-family: "Fusion Pixel 12";
  }
  .work {
    width: 100%;
    height: 320px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .work img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .caption {
    border-top: 1px solid {{ ink.black }};
    margin-top: 14px;
    padding-top: 10px;
  }
  .title {
    font: 24px/30px "Fusion Pixel 12";
  }
  .artist {
    font: 12px/16px "Fusion Pixel 12";
    margin-top: 5px;
  }
  .credit {
    font: 10px/14px "Fusion Pixel 10";
    margin-top: 5px;
  }

{% if panel.size == (528, 792) %}
body {width:528px; height:792px; margin:0; padding:24px; box-sizing:border-box}
.work {height:590px}
.caption {margin-top:16px}
.title {font-size:24px; line-height:30px; overflow-wrap:anywhere}
{% endif %}
</style></head><body>
<div class="work"><img src="{{ data.image_uri }}" alt="{{ data.title }}"></div>
<div class="caption"><div class="title">{{ data.title }}</div>
<div class="artist">{{ data.artist }} · {{ data.date }}</div>
<div class="credit">{{ data.credit }}</div></div>
</body></html>
