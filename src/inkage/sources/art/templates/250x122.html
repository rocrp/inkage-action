<!doctype html>
<html><head><meta charset="utf-8"><style>
  * {
    font-weight: 400;
    font-synthesis: none;
    letter-spacing: 0;
    font-variant-ligatures: none;
  }
  body {
    font-size: 12px;
    line-height: 1.2;
    width: 250px;
    height: 122px;
    box-sizing: border-box;
    padding: 6px;
    display: flex;
    gap: 8px;
    color: {{ ink.black }};
    background: {{ ink.white }};
    font-family: "Fusion Pixel 12";
  }
  .work {
    width: 92px;
    flex-shrink: 0;
    height: 110px;
  }
  .work img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .caption {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .title {
    font: 12px/16px "Fusion Pixel 12";
  }
  .artist {
    font: 10px/14px "Fusion Pixel 10";
    margin-top: 4px;
  }
  .date {
    font: 10px/14px "Fusion Pixel 10";
    margin-top: 2px;
  }
  .credit {
    font: 10px/14px "Fusion Pixel 10";
    margin-top: 4px;
  }
</style></head><body>
<div class="work"><img src="{{ data.image_uri }}" alt="{{ data.title }}"></div>
<div class="caption"><div class="title">{{ data.title }}</div>
<div class="artist">{{ data.artist }}</div><div class="date">{{ data.date }}</div>
<div class="credit">The Met · Public domain</div></div>
</body></html>
