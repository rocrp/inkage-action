<!doctype html>
<html><head><meta charset="utf-8"><style>
body { width:250px; height:122px; box-sizing:border-box; padding:6px; display:flex; gap:8px;
  color:{{ ink.black }}; background:{{ ink.white }}; font-family:Georgia,serif; }
.work { width:92px; flex-shrink:0; height:110px; }
.work img { width:100%; height:100%; object-fit:contain; }
.caption { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.title { font-size:11px; font-weight:bold; line-height:1.12; }
.artist { margin-top:4px; font:10px/1.15 Arial,sans-serif; }
.date { font:9px/1.15 Arial,sans-serif; margin-top:2px; }
.credit { margin-top:4px; font:8px/1.1 Arial,sans-serif; }
</style></head><body>
<div class="work"><img src="{{ data.image_uri }}" alt="{{ data.title }}"></div>
<div class="caption"><div class="title">{{ data.title }}</div>
<div class="artist">{{ data.artist }}</div><div class="date">{{ data.date }}</div>
<div class="credit">The Met · Public domain</div></div>
</body></html>
