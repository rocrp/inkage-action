{%- set accent = ink.red if 'red' in panel.inks else ink.black -%}
<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { width: 250px; height: 122px; margin: 0; background: {{ ink.white }}; color: {{ ink.black }};
         font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif; box-sizing: border-box; padding: 3px 6px; overflow: hidden; }
  .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 900;
          border-bottom: 2px solid {{ ink.black }}; white-space: nowrap; }
  .head span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 11px; font-weight: 700; margin-left: 6px; }
  .item { display: flex; gap: 4px; margin-top: 3px; }
  .num { font-size: 12px; font-weight: 900; color: {{ accent }}; width: 9px; }
  .title { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; line-height: 1.2; overflow: hidden;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
</style></head><body>
  <div class="head"><span>{{ data.label }}</span><span class="time">{{ now.strftime("%H:%M") }}</span></div>
  {%- for it in data["items"][:3] %}
  <div class="item"><span class="num">{{ loop.index }}</span><span class="title">{{ it.title }}</span></div>
  {%- endfor %}
</body></html>
