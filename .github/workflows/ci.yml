name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Configure shared Ruff policy
        env:
          RUFF_CONFIG: ${{ vars.RUFF_CONFIG }}
        run: |
          : "${RUFF_CONFIG:?Set the repository variable RUFF_CONFIG to the shared ruff.toml contents}"
          printf '%s\n' "$RUFF_CONFIG" > "$HOME/.ruff.toml"
      - run: uv sync --locked --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: fonts-noto-cjk-${{ runner.os }}-v1
      - run: scripts/setup-runner.sh .
      - run: uvx ruff format --check src tests
      - run: uvx ruff check src tests
      - run: uv run ty check
      - run: uv run pytest -q
      - run: uv build
