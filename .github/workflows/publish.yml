# Reusable workflow: render the caller's inkage.toml and deploy it to the caller's GitHub Pages,
# then hand over to the next Run (the Chain, see docs/adr/0003-self-dispatch-chain.md).
# Caller needs: `on: workflow_dispatch` and permissions { contents: read, pages: write, id-token: write, actions: write }.
name: inkage-publish

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: inkage.toml
      sources_dir:
        type: string
        default: ""
      fonts_dir:
        type: string
        default: ""
      chain:
        description: After deploying, wait until the earliest next_due and dispatch the next Run (needs free minutes, i.e. a public repo)
        type: boolean
        default: true
      keepalive:
        description: Re-enable the calling workflow on scheduled runs so 60 days without commits cannot disable it
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Runs queue behind each other; nothing is cancelled, so a Site is never half-deployed.
    concurrency:
      group: inkage-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      next_due: ${{ steps.inkage.outputs.next_due }}
      deployed: ${{ steps.deploy.outcome }}
    steps:
      - uses: actions/checkout@v5

      # The action at the very commit of this workflow file, whatever ref the caller used.
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .inkage-action

      - id: pages
        uses: actions/configure-pages@v5

      - id: inkage
        uses: ./.inkage-action
        with:
          config: ${{ inputs.config }}
          sources_dir: ${{ inputs.sources_dir }}
          fonts_dir: ${{ inputs.fonts_dir }}
          site_url: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.inkage.outputs.dist }}

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        if: inputs.keepalive && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          gh workflow enable "${wf%@*}" -R "$GITHUB_REPOSITORY"

      - name: Fail if a Source failed
        if: steps.inkage.outputs.failed == 'true'
        run: |
          echo "::error::At least one Source failed; its previous Frame was kept. See the job summary."
          exit 1

  chain:
    needs: publish
    # A Source failure is reported after deployment; it must not break refreshes for every Source.
    # Still stop on cancellation or a failed/missing deployment.
    if: ${{ !cancelled() && inputs.chain && needs.publish.outputs.deployed == 'success' }}
    runs-on: ubuntu-latest
    # Exactly one waiter at a time: a newer Run (push, cron, dispatch) replaces the one sleeping.
    concurrency:
      group: inkage-chain
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts/chain-next.sh
          sparse-checkout-cone-mode: false
      - name: Wait for next_due, then dispatch the next Run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/chain-next.sh "${{ needs.publish.outputs.next_due }}"
