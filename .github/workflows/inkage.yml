# This repo's own Site, built from inkage.toml through the reusable workflow.
name: inkage

on:
  schedule:
    - cron: "2-59/5 * * * *" # resurrects the Chain; GitHub fires this hours late or not at all
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
