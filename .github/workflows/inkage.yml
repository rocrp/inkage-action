# This repo's own Site, built from inkage.toml through the reusable workflow.
name: inkage

on:
  schedule:
    - cron: "2-59/5 * * * *" # every 5 minutes, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: inkage-pages
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
