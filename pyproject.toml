[project]
name = "inkage"
version = "0.1.0"
description = "Scheduled e-paper Frames rendered on GitHub Actions and published as a static Site"
license = "MIT"
authors = [
    { name = "RoCry", email = "crysheen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "lunar-python>=1.4.8",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "typer>=0.27.3",
]

[project.scripts]
inkage = "inkage:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fonttools>=4.66.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["inkage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:inkage.*"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
